services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      # MSSQL_SA_PASSWORD, not SA_PASSWORD: the old name still works and prints a deprecation
      # warning on every start.
      - MSSQL_SA_PASSWORD=Password@
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # Whichever client the image ships. It named /opt/mssql-tools2, which is not a path any
      # release of this image provides — so the check could never pass, and `depends_on:
      # service_healthy` would hold the API back until compose gave up. mssql-tools18 needs -C to
      # accept the server's self-signed certificate; the older one has no such flag, hence two
      # commands rather than one path guessed twice.
      test: >-
        /bin/sh -c '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
        || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The object store photos live in. SeaweedFS rather than MinIO: MinIO archived its community
  # repository in April 2026 and ships no binaries from it. Both speak S3, which is the part that
  # matters — the API talks to this through AWSSDK.S3, so pointing it at a hosted bucket later is a
  # change of four environment variables and no code. See ADR 0021.
  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    container_name: seaweedfs
    # One process running master, volume server and the S3 gateway together. Fine for a machine
    # running the stack locally, and the only alternative is three containers to say the same thing.
    # -s3.config is not optional dressing. Started without one, SeaweedFS allows anonymous
    # requests and refuses signed ones outright — and every AWS SDK signs everything, so the API
    # would get a 500 on each upload from a container reporting itself healthy.
    command: server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json
    ports:
      # The S3 endpoint. 9333 is the master's own UI, exposed because it is the only way to see
      # what the store actually holds without a client.
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # An actual write, because it asks the question that matters: until a volume server has
      # registered, allocation fails while everything else looks healthy — a bucket can still be
      # created, because that is metadata, and the first upload is what discovers the problem.
      # `weed upload` meets a volume-less master with "No writable volumes" and exit code 2, and
      # the one-minute TTL makes the store forget each probe's thirteen bytes on its own.
      #
      # `weed` itself and not wget, because this image holds exactly one file: /usr/bin/weed.
      # No shell, no busybox — a CMD-SHELL check can never even start, it fails with "/bin/sh:
      # no such file" while the process it is meant to probe runs fine, and `depends_on:
      # service_healthy` then holds every host back forever. Asking the binary the image ships
      # is the same lesson Mailpit's check below already carries.
      #
      # Not the S3 port: an unsigned request there answers 403, which no client reads as health.
      test: ["CMD", "/usr/bin/weed", "upload", "-master", "localhost:9333", "-ttl", "1m", "/etc/hostname"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The mail server the outbox consumers deliver through. Mailpit rather than MailHog: same idea —
  # an SMTP sink for development that keeps every message it accepts — but maintained, and with an
  # HTTP API the integration tests read delivered messages back through. The API talks to it over
  # plain SMTP via MailKit, so pointing at a hosted relay later is a change of environment
  # variables and no code. See ADR 0031.
  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: mailpit
    ports:
      # SMTP submission. 8025 is the web UI and the HTTP API — the only way to see what was sent
      # without a mail client.
      - "1025:1025"
      - "8025:8025"
    # No volume on purpose: a mail sink that forgets on restart is a feature, not a gap.
    healthcheck:
      # The binary carries its own readiness probe precisely so images without wget or curl can
      # healthcheck; guessing at busybox tooling is how the SeaweedFS check above went wrong once.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The telemetry backend the hosts export to: traces, metrics and structured logs, over OTLP.
  # The Aspire Dashboard rather than a Grafana stack for the same reason Mailpit answers for mail —
  # one container, no configuration files, a UI that shows everything a developer needs — and like
  # Mailpit it keeps no volume: telemetry history belongs to a production deployment's backend,
  # not to a machine that was only supposed to start. The hosts never depend on it, in the compose
  # graph or anywhere else: the exporter is batched and background, and a dashboard that is down
  # costs dropped batches and nothing more (ADR 0095).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.4
    container_name: aspire-dashboard
    environment:
      # A loopback port on a development machine: the dashboard's login-token dance would be
      # friction with nothing behind it. Anything production-shaped runs its own backend.
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      # The UI, and the OTLP gRPC ingress mapped onto the conventional 4317 so the committed
      # Development settings can say http://localhost:4317.
      - "18888:18888"
      - "4317:18889"
    # No healthcheck, and not from neglect: the image is shell-less like SeaweedFS's, so a
    # CMD-SHELL probe could never start — and nothing waits on this container anyway, which is the
    # point. `--wait` treats a check-less container as ready once it is running.

  ddd-api:
    # Behind the full profile, with the two other hosts: a bare `docker compose up` starts the
    # three dependencies alone, which is what a developer running the hosts from an IDE needs —
    # the Development settings already point at localhost. `--profile full` is the whole stack,
    # containers included (ADR 0075).
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/DDD/Api/Dockerfile
    container_name: ddd-api
    ports:
      - "5085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__TrainingContext=Server=sqlserver;Database=TrainingHub;User Id=sa;Password=Password@;TrustServerCertificate=True;MultipleActiveResultSets=True
      - Jwt__Key=<(_aHuci8-$=j0J}c>Y{}J?msu3Xe;W*
      - Jwt__Issuer=TrainingHub.Api
      - Jwt__Audience=TrainingHub.Web
      - Jwt__ExpireMinutes=60
      # Service name, not localhost: inside the network the store is another host. The credentials
      # are checked — they have to match an identity in docker/seaweedfs-s3.json, which is what
      # makes the store accept a signed request at all.
      - ObjectStorage__ServiceUrl=http://seaweedfs:8333
      - ObjectStorage__BucketName=blrefactoring
      - ObjectStorage__AccessKey=blrefactoring
      - ObjectStorage__SecretKey=blrefactoring
      - ObjectStorage__CreateBucketOnStartup=true
      - Smtp__Host=mailpit
      - Smtp__Port=1025
      - Smtp__SenderAddress=no-reply@traininghub.local
      - Smtp__SenderName=TrainingHub
      # The address a browser on the host opens, not a service name: the reset link this key
      # anchors travels by email and is clicked outside the compose network (ADR 0084).
      - PasswordReset__LinkBaseAddress=https://localhost:7068
      # Same reasoning for the verification link (ADR 0090).
      - EmailVerification__LinkBaseAddress=https://localhost:7068
      # Service name and container port, not the host mapping: inside the network the dashboard
      # is another host. Blank it to run this container with telemetry off (ADR 0095).
      - Telemetry__OtlpEndpoint=http://aspire-dashboard:18889
    healthcheck:
      # Liveness, not readiness, on purpose: a container check drives restart decisions, and
      # restarting this process cannot fix a dependency /health/ready would report on. curl is
      # installed in the image's final stage for exactly this line. CI builds this image but
      # never runs it (ADR 0065), so the check is proven by running the stack, not by a
      # pipeline. See ADR 0037.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      sqlserver:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # Uniformity rather than necessity: the host starts fine while the mail server is down — an
      # undeliverable email is what the outbox's retry budget exists for — but Mailpit is ready in
      # milliseconds, so waiting for it costs nothing and keeps the three dependencies alike.
      mailpit:
        condition: service_healthy

  # The same use cases, written the other way — commands and queries rather than application
  # services — over the same domain and the same database. Its environment is ddd-api's, because
  # the two hosts differ in how they are written and in nothing else.
  cqrs-api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/DDDWithCqrs/Api/Dockerfile
    container_name: cqrs-api
    ports:
      - "5086:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__TrainingContext=Server=sqlserver;Database=TrainingHub;User Id=sa;Password=Password@;TrustServerCertificate=True;MultipleActiveResultSets=True
      - Jwt__Key=<(_aHuci8-$=j0J}c>Y{}J?msu3Xe;W*
      - Jwt__Issuer=TrainingHub.Api
      - Jwt__Audience=TrainingHub.Web
      - Jwt__ExpireMinutes=60
      - ObjectStorage__ServiceUrl=http://seaweedfs:8333
      - ObjectStorage__BucketName=blrefactoring
      - ObjectStorage__AccessKey=blrefactoring
      - ObjectStorage__SecretKey=blrefactoring
      - ObjectStorage__CreateBucketOnStartup=true
      - Smtp__Host=mailpit
      - Smtp__Port=1025
      - Smtp__SenderAddress=no-reply@traininghub.local
      - Smtp__SenderName=TrainingHub
      - PasswordReset__LinkBaseAddress=https://localhost:7068
      - EmailVerification__LinkBaseAddress=https://localhost:7068
      - Telemetry__OtlpEndpoint=http://aspire-dashboard:18889
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # After ddd-api is healthy, rather than beside it, and the three dependencies below are not
      # the reason. In Development both hosts apply their migrations at startup (ADR 0003) against
      # one database, so starting them together is the race on DDL that record names as the reason
      # not to migrate from the process serving requests. Ordered, the migrations run once and this
      # host finds nothing pending. A database per host would end the race and end the
      # demonstration with it: the two stacks exist to serve the same domain.
      ddd-api:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # The backend for frontend, and the only container a browser opens.
  bff:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/Web/TrainingHub.Blazor/TrainingHub.Blazor/Dockerfile
    container_name: bff
    ports:
      - "7068:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Plain HTTP, and correctly so: this is server to server inside the compose network, carries
      # no cookie and no browser. The hop that needs TLS is the one below, which a browser makes.
      - Api__BaseAddress=http://ddd-api:8080
      # The session cookie is `__Host-bff` with Secure always on, so a browser refuses to store it
      # over plain HTTP: this host served without TLS would render every page and sign nobody in.
      # The certificate is the developer's own — `dotnet dev-certs https -ep`, see the README — so
      # the machine's browser already trusts it and there is nothing to accept by hand.
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/traininghub.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Password@
      # Service name and container port, like the API hosts above: inside the network the
      # dashboard is another host (ADR 0095).
      - Telemetry__OtlpEndpoint=http://aspire-dashboard:18889
      # No Turnstile pair, so the contact form runs without the challenge (ADR 0083) — the
      # honeypot and both rate windows still stand. Supplying Turnstile__SiteKey and
      # Turnstile__SecretKey together switches it on; verification is then a real HTTPS call to
      # challenges.cloudflare.com, the one outbound need this container has.
    volumes:
      - ./docker/https:/https:ro
    healthcheck:
      # Over TLS, because it is the only address this container serves, and `-k` because the
      # container is checking itself: the certificate is trusted by the developer's machine, not by
      # this image's store. Checking the plain-HTTP port instead would have been the softer bug —
      # UseHttpsRedirection answers it with a 307, and curl without -L reads a redirect as success,
      # so the check would pass without the endpoint ever being reached.
      test: ["CMD", "curl", "-fsS", "-k", "https://localhost:8443/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      ddd-api:
        condition: service_healthy

volumes:
  sqlserver_data:
  seaweedfs_data:
